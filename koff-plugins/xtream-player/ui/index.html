<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xtream Browser</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 22px; background: Canvas; color: CanvasText; font-size: 13px; }
    h1 { margin: 0 0 18px; font-size: 22px; }
    h2 { margin: 0 0 10px; font-size: 15px; }
    section { padding: 16px; margin-bottom: 16px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 12px; }
    label { display: grid; gap: 5px; margin-bottom: 10px; font-weight: 600; }
    input { width: 100%; padding: 8px 10px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius: 7px; background: Field; color: FieldText; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row input { flex: 1; }
    button { padding: 8px 12px; border: 0; border-radius: 7px; background: #0a84ff; color: white; font-weight: 600; cursor: pointer; }
    button.secondary { background: color-mix(in srgb, CanvasText 13%, transparent); color: CanvasText; }
    button.danger { background: #d33b33; }
    button:disabled { opacity: .5; cursor: default; }
    #status { min-height: 18px; margin: 8px 0 0; color: color-mix(in srgb, CanvasText 65%, transparent); }
    #status.error { color: #ff453a; }
    #results { display: grid; gap: 7px; margin-top: 12px; }
    .result { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px; background: color-mix(in srgb, CanvasText 7%, transparent); }
    .result span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .muted { color: color-mix(in srgb, CanvasText 60%, transparent); font-size: 12px; }
  </style>
</head>
<body>
  <h1>Xtream Browser</h1>

  <section>
    <h2>Provider</h2>
    <form id="config-form" autocomplete="off">
      <label>Server URL<input id="server" type="url" required placeholder="https://provider.example:443"></label>
      <label>Username<input id="username" type="text" required autocomplete="username"></label>
      <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
      <div class="row">
        <button type="submit">Save securely</button>
        <button id="clear" class="danger" type="button">Clear local configuration</button>
      </div>
      <p class="muted">The password is sent only to IINA's plugin process and stored in macOS Keychain.</p>
    </form>
  </section>

  <section>
    <h2>Search TV, movies and series</h2>
    <form id="search-form" class="row">
      <input id="query" type="search" required maxlength="80" placeholder="Channel, movie or series">
      <button id="search-button" type="submit">Search</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="results"></div>
  </section>

  <script>
    (function () {
      "use strict";
      var form = document.getElementById("config-form");
      var searchForm = document.getElementById("search-form");
      var status = document.getElementById("status");
      var results = document.getElementById("results");
      var searchButton = document.getElementById("search-button");

      function setStatus(message, isError) {
        status.textContent = message || "";
        status.className = isError ? "error" : "";
      }

      function send(name, data) {
        window.iina.postMessage(name, data || {});
      }

      window.iina.onMessage("config", function (config) {
        document.getElementById("server").value = config.server || "";
        document.getElementById("username").value = config.username || "";
        document.getElementById("password").value = "";
        if (config.configured) {
          setStatus("Configuration available. Enter the password only when changing it.", false);
          document.getElementById("query").focus();
        }
      });

      window.iina.onMessage("loading", function (state) {
        searchButton.disabled = Boolean(state.active);
        if (state.active) setStatus("Loading…", false);
      });

      window.iina.onMessage("notice", function (notice) { setStatus(notice.message, false); });
      window.iina.onMessage("error", function (error) { setStatus(error.message || "Operation failed", true); });

      var TYPE_LABELS = { live: "TV", movie: "Movie", series: "Series" };
      var lastItems = [];

      function addRow(item, actionLabel, onAction) {
        var row = document.createElement("div");
        row.className = "result";
        var name = document.createElement("span");
        name.textContent = item.name;
        var action = document.createElement("button");
        action.type = "button";
        action.textContent = actionLabel;
        action.addEventListener("click", onAction);
        row.appendChild(name);
        if (item.type) {
          var badge = document.createElement("span");
          badge.className = "muted";
          badge.textContent = TYPE_LABELS[item.type] || item.type;
          row.appendChild(badge);
        }
        row.appendChild(action);
        results.appendChild(row);
      }

      function renderResults(items) {
        results.textContent = "";
        setStatus(items.length ? items.length + " result(s)" : "No match", false);
        items.forEach(function (item) {
          if (item.type === "series") {
            addRow(item, "Episodes", function () { send("open-series", { id: item.id }); });
          } else {
            addRow(item, "Play in IINA", function () { send("play", { type: item.type, id: item.id }); });
          }
        });
      }

      window.iina.onMessage("results", function (payload) {
        lastItems = payload.items || [];
        renderResults(lastItems);
      });

      window.iina.onMessage("episodes", function (payload) {
        results.textContent = "";
        var items = payload.items || [];
        setStatus(items.length ? payload.seriesName + " — " + items.length + " episode(s)" : "No episode found", false);
        addRow({ type: "", name: payload.seriesName || "Series" }, "← Back", function () { renderResults(lastItems); });
        items.forEach(function (item) {
          addRow(item, "Play in IINA", function () { send("play-episode", { id: item.id }); });
        });
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        send("save-config", {
          server: document.getElementById("server").value,
          username: document.getElementById("username").value,
          password: document.getElementById("password").value
        });
      });

      searchForm.addEventListener("submit", function (event) {
        event.preventDefault();
        send("search", { query: document.getElementById("query").value });
      });

      document.getElementById("clear").addEventListener("click", function () {
        if (window.confirm("Clear the local Xtream configuration?")) send("clear-config", {});
      });

      send("ready", {});
    })();
  </script>
</body>
</html>
